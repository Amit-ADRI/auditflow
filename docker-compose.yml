services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auditflow
      POSTGRES_USER: auditflow
      POSTGRES_PASSWORD: auditflow_dev
    ports:
      - "5432:5432"
    volumes:
      - auditflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditflow -d auditflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - auditflow_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auditflow_postgres:
  auditflow_redis:
